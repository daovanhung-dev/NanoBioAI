    - assets/nabi_v2/01_character/01_static_expressions/
    - assets/nabi_v2/01_character/02_30fps_frames/
    - assets/nabi_v2/01_character/02_30fps_frames/01_core/nabi_anim_001_happy_idle_breathing/
