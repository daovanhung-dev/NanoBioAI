name: nano_app
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^3.3.1

  # Navigation
  go_router: ^17.2.3
  app_links: ^6.4.1

  # Network
  dio: ^5.9.2
  connectivity_plus: ^7.1.1

  # Local Storage
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5

  # Supabase
  supabase_flutter: ^2.12.4
  qr_flutter: ^4.1.0

  # Env
  flutter_dotenv: ^6.0.1

  # Settings Feature Dependencies
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.7
  image_picker: ^1.0.7
  image: ^4.8.0
  permission_handler: ^11.2.0
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  flutter_local_notifications: 19.5.0
  timezone: 0.10.1
  flutter_timezone: 5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  rename: ^3.0.2
  mockito: ^5.4.4
  build_runner: ^2.4.8
  sqflite_common_ffi: ^2.3.6
  rename_app: ^1.6.6

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-400.ttf
          weight: 400
        - asset: assets/fonts/roboto/Roboto-500.ttf
          weight: 500
        - asset: assets/fonts/roboto/Roboto-600.ttf
          weight: 600
        - asset: assets/fonts/roboto/Roboto-700.ttf
          weight: 700

  assets:
    - assets/
    - assets/data/
    - assets/images/
    - assets/icons/
    - assets/icons/custom/
    - assets/icons/filled/
    - assets/icons/health/
    - assets/icons/nutrition/
    - assets/icons/outlined/
    - assets/config/
    # Only Nabi v2 is bundled for release. V1 remains in Git as a source-only
    # rollback package; see docs/features/nabi_character/NABI_V2_ROLLOUT.md.
    - assets/images/nabi_v2/
    - assets/images/nabi_v2/chat/
    - assets/images/nabi_v2/core/
