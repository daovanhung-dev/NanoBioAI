<!DOCTYPE html>
<html>
<head>
    <title>WiFi Configuration</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#F4F7FB">
    <meta name="color-scheme" content="light dark">
    <style>
        :root {
            --bg-grad-1: #f8faff;
            --bg-grad-2: #edf3fc;
            --surface: #ffffff;
            --border: #dce5f2;
            --text: #14243a;
            --text-muted: #5d6f88;
            --success: #16845c;
            --accent: #285cc5;
            --shadow: 0 14px 38px rgba(34, 65, 114, 0.10), 0 3px 10px rgba(34, 65, 114, 0.04);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-grad-1: #101a2a;
                --bg-grad-2: #17253a;
                --surface: #1b2a40;
                --border: #344963;
                --text: #ecf3ff;
                --text-muted: #afbed2;
                --success: #65d6a2;
                --accent: #83aaf4;
                --shadow: 0 14px 38px rgba(0, 0, 0, 0.30);
            }
        }

        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            margin: 0;
            overflow-x: hidden;
            overflow-y: auto;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text);
            background: radial-gradient(ellipse at 50% 0%, rgba(91, 137, 219, 0.13), transparent 45%),
                        linear-gradient(160deg, var(--bg-grad-1), var(--bg-grad-2));
        }

        .container {
            display: flex;
            min-height: 100vh;
            min-height: 100svh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: max(24px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right))
                     max(28px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            padding: 30px 30px 34px;
            max-width: 390px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            position: absolute;
            inset: 0 0 auto;
            height: 4px;
            background: linear-gradient(90deg, var(--accent), #6b91d8 60%, #65b895);
            content: "";
        }
        .brand-name {
            margin: 0 0 18px;
            color: var(--accent);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .nabi-avatar {
            width: 72px;
            height: 72px;
            object-fit: cover;
            margin-bottom: 18px;
            border: 4px solid var(--surface);
            border-radius: 50%;
            background: #e7eefc;
            box-shadow: 0 0 0 5px rgba(40, 92, 197, 0.12), 0 8px 24px rgba(34, 65, 114, 0.14);
        }

        .checkmark {
            width: 110px;
            height: 110px;
            margin-bottom: 24px;
        }
        .checkmark__circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke: var(--success);
            fill: none;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }
        .checkmark__check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            stroke: var(--success);
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.6s forwards;
        }

        @keyframes stroke {
            to { stroke-dashoffset: 0; }
        }

        .message {
            text-align: center;
        }
        .message .primary {
            font-size: clamp(18px, 5vw, 21px);
            font-weight: 700;
            margin: 0 0 6px;
            line-height: 1.35;
            overflow-wrap: anywhere;
        }
        .message .secondary {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0;
        }
        @media (max-width: 380px) {
            .container { padding-inline: 14px; }
            .card { padding: 26px 20px 28px; }
            .checkmark { width: 94px; height: 94px; margin-bottom: 18px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
        }
    </style>
</head>

    <script>
        window.addEventListener('load', function() {
            const params = new URLSearchParams(window.location.search);
            const lang = params.get('lang') || 'vi-VN';
            document.documentElement.lang = lang;
            document.documentElement.dir = ['ar', 'fa', 'he'].includes(lang.split('-')[0]) ? 'rtl' : 'ltr';
            const message = params.get('message') || 'Cấu hình thành công!';
            document.title = message;
            document.getElementById('message').textContent = message;

            // Send exit request after a short delay
            setTimeout(function() {
                fetch('/exit', {
                    method: 'POST'
                })
                .then(response => {
                    if (response.ok) {
                        console.log('Exit config mode request sent');
                    } else {
                        console.error('Failed to send exit request');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                });
            }, 1000);
        });
    </script>
