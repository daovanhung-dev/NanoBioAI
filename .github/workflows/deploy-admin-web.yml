name: Deploy NanoBio Admin Web

on:
  push:
    branches: [main]
    paths:
      - 'admin-web/**'
      - '.github/workflows/deploy-admin-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        working-directory: admin-web
        run: npm ci

      - name: Typecheck
        working-directory: admin-web
        run: npm run typecheck

      - name: Test
        working-directory: admin-web
        run: npm test

      - name: Validate deployment configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.NANOBIO_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.NANOBIO_SUPABASE_ANON_KEY }}
        run: |
          set -eu
          if [ -z "${VITE_SUPABASE_URL:-}" ]; then
            echo "::error::Missing GitHub Actions Variable NANOBIO_SUPABASE_URL"
            exit 1
          fi
          case "$VITE_SUPABASE_URL" in
            http://*|https://*) ;;
            *)
              echo "::error::NANOBIO_SUPABASE_URL must be an HTTP(S) URL"
              exit 1
              ;;
          esac
          if [ -z "${VITE_SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Missing GitHub Actions Secret NANOBIO_SUPABASE_ANON_KEY"
            exit 1
          fi

      - name: Build
        working-directory: admin-web
        env:
          VITE_SUPABASE_URL: ${{ vars.NANOBIO_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.NANOBIO_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: admin-web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
