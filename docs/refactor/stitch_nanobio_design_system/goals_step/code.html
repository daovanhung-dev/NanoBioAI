                Tiếp theo <span class="hidden bg-surface-container-lowest text-primary px-2 py-0.5 rounded-full text-label-chip font-label-chip ml-1" id="countBadge">0</span>
</button>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.goal-card');
            const nextBtn = document.getElementById('nextBtn');
            const countBadge = document.getElementById('countBadge');
            let selectedCount = 0;

            cards.forEach(card => {
                card.addEventListener('click', () => {
                    const isSelected = card.getAttribute('data-selected') === 'true';
                    
                    if (isSelected) {
                        card.setAttribute('data-selected', 'false');
                        selectedCount--;
                    } else {
                        card.setAttribute('data-selected', 'true');
                        selectedCount++;
                    }

                    // Update Button State
                    if (selectedCount > 0) {
                        nextBtn.classList.remove('opacity-50', 'pointer-events-none');
                        countBadge.classList.remove('hidden');
                        countBadge.textContent = selectedCount;
                    } else {
                        nextBtn.classList.add('opacity-50', 'pointer-events-none');
                        countBadge.classList.add('hidden');
                    }
                });
            });
        });
    </script>
