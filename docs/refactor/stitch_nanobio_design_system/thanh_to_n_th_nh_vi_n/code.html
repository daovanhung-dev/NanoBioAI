            animation: pulse-border 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

<body class="bg-background min-h-screen text-on-background pb-[100px]">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md shadow-sm">
<div class="flex items-center justify-between px-page-padding h-16 w-full max-w-md mx-auto">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-screen-title text-screen-title text-primary dark:text-primary-fixed-dim">Thanh Toán</h1>
<div class="w-10"></div> <!-- Spacer -->
</div>
</header>
<!-- Main Content -->
<main class="pt-[88px] px-page-padding max-w-md mx-auto space-y-section-gap">
<!-- Plan Selection Section (Visible by default) -->
<section class="space-y-4" id="plan-selection">
<div class="text-center mb-6">
<h2 class="font-section-title text-section-title text-text-primary mb-2">Chọn Gói Hội Viên</h2>
<p class="font-body-base text-body-base text-text-secondary">Nâng cấp trải nghiệm sức khỏe cùng NaBi</p>
</div>
<!-- Basic Plan Card -->
<button class="w-full text-left bg-surface-container-lowest border border-border-soft rounded-[20px] p-card-padding shadow-[0_8px_20px_0_rgba(20,163,111,0.08)] hover:border-primary transition-colors focus:ring-2 focus:ring-focus-ring relative group" onclick="selectPlan('basic')">
<div class="flex justify-between items-start mb-2">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-full bg-mint-surface flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-xl" data-icon="spa">spa</span>
</div>
<h3 class="font-cta text-cta text-text-primary">Gói Cơ Bản</h3>
</div>
<span class="font-section-title text-section-title text-primary">99k<span class="text-sm font-normal text-text-secondary">/tháng</span></span>
</div>
<ul class="space-y-2 mt-4 font-body-sm text-body-sm text-text-secondary">
<li class="flex items-center gap-2"><span class="material-symbols-outlined text-success text-[16px]">check</span> Theo dõi chỉ số sức khỏe cơ bản</li>
<li class="flex items-center gap-2"><span class="material-symbols-outlined text-success text-[16px]">check</span> Lời khuyên dinh dưỡng hàng ngày</li>
</ul>
</button>
<!-- Plus Plan Card (Selected State Example) -->
<button class="w-full text-left bg-surface-container-lowest border-2 border-primary rounded-[20px] p-card-padding shadow-[0_8px_20px_0_rgba(20,163,111,0.16)] relative" onclick="selectPlan('plus')">
<div class="absolute top-0 right-0 bg-primary text-on-primary font-label-chip text-label-chip px-3 py-1 rounded-bl-[20px] rounded-tr-[16px]">
                    Phổ Biến Nhất
                </div>
<div class="flex justify-between items-start mb-2 mt-2">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-full bg-primary-soft flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-xl" data-icon="verified">verified</span>
</div>
<h3 class="font-cta text-cta text-text-primary">Gói Plus</h3>
</div>
<span class="font-section-title text-section-title text-primary">199k<span class="text-sm font-normal text-text-secondary">/tháng</span></span>
</div>
<ul class="space-y-2 mt-4 font-body-sm text-body-sm text-text-secondary">
<li class="flex items-center gap-2"><span class="material-symbols-outlined text-success text-[16px]">check</span> Mọi tính năng của gói Cơ Bản</li>
<li class="flex items-center gap-2"><span class="material-symbols-outlined text-success text-[16px]">check</span> Tư vấn trực tiếp với NaBi Assistant</li>
<li class="flex items-center gap-2"><span class="material-symbols-outlined text-success text-[16px]">check</span> Báo cáo chuyên sâu hàng tháng</li>
</ul>
</button>
</section>
<!-- Payment Pending Section (Hidden by default, shown for demo) -->
<section class="hidden space-y-6" id="payment-pending">
<div class="bg-surface-container-lowest rounded-[24px] p-6 text-center shadow-[0_8px_20px_0_rgba(20,163,111,0.08)] border border-border-soft">
<div class="w-16 h-16 mx-auto bg-energy-yellow/20 text-warning rounded-full flex items-center justify-center mb-4 pulse-border border-4">
<span class="material-symbols-outlined text-3xl" data-icon="hourglass_top">hourglass_top</span>
</div>
<h2 class="font-section-title text-section-title text-text-primary mb-2">Đang chờ thanh toán</h2>
<p class="font-body-sm text-body-sm text-text-secondary mb-6">Vui lòng quét mã QR dưới đây qua ứng dụng ngân hàng hoặc ví điện tử để hoàn tất.</p>
<!-- Mock QR Code -->
<div class="w-48 h-48 mx-auto bg-surface-container rounded-xl flex items-center justify-center mb-6 relative overflow-hidden">

<span class="material-symbols-outlined text-4xl text-outline z-10">qr_code_2</span>
</div>
<div class="bg-mint-surface p-4 rounded-xl text-left border border-border-soft">
<div class="flex justify-between items-center mb-2">
<span class="font-body-sm text-body-sm text-text-secondary">Số tiền:</span>
<span class="font-cta text-cta text-primary">199.000 VNĐ</span>
</div>
<div class="flex justify-between items-center">
<span class="font-body-sm text-body-sm text-text-secondary">Mã GD:</span>
<span class="font-label-chip text-label-chip text-text-primary bg-surface py-1 px-2 rounded font-mono">NB20231024</span>
</div>
</div>
</div>
<button class="w-full py-4 rounded-xl border border-primary text-primary font-cta text-cta text-center hover:bg-mint-surface transition-colors" onclick="cancelPayment()">
                Hủy giao dịch
            </button>
</section>
</main>
<!-- Fixed Bottom CTA (For Plan Selection) -->
<div class="fixed bottom-0 left-0 w-full bg-surface/90 backdrop-blur-md p-4 border-t border-border-soft z-40 pb-safe" id="bottom-cta">
<div class="max-w-md mx-auto">
<button class="w-full bg-gradient-to-r from-[#0F8E62] to-[#32C789] text-on-primary font-cta text-cta py-4 rounded-[16px] shadow-[0_8px_20px_0_rgba(20,163,111,0.24)] hover:shadow-lg transition-all active:scale-[0.98]" onclick="proceedToPayment()">
                Tiếp tục thanh toán - Gói Plus
            </button>
</div>
</div>
<script>
        // Simple mock logic to switch states for demonstration
        function proceedToPayment() {
            document.getElementById('plan-selection').classList.add('hidden');
            document.getElementById('bottom-cta').classList.add('hidden');
            document.getElementById('payment-pending').classList.remove('hidden');
        }

        function cancelPayment() {
            document.getElementById('payment-pending').classList.add('hidden');
            document.getElementById('plan-selection').classList.remove('hidden');
            document.getElementById('bottom-cta').classList.remove('hidden');
        }

        function selectPlan(plan) {
            // Visual selection logic would go here
            console.log('Selected:', plan);
        }
    </script>
