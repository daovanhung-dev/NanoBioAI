<script>
        // Simple script to handle selection and show confirmation bar
        const radioButtons = document.querySelectorAll('input[name="meal_replacement"]');
        const confirmationBar = document.getElementById('confirmation-bar');
        const selectedMealNameDisplay = document.getElementById('selected-meal-name');

        radioButtons.forEach(radio => {
            radio.addEventListener('change', (e) => {
                // visually update cards (optional, CSS peer handles border, but we might want background change)
                document.querySelectorAll('.bento-card').forEach(card => card.classList.remove('selected'));
                if(e.target.checked) {
                    e.target.closest('.bento-card').classList.add('selected');
                    
                    // Get meal name
                    const mealName = e.target.closest('.bento-card').querySelector('h3').innerText;
                    selectedMealNameDisplay.innerText = mealName;
                    
                    // Show confirmation bar
                    confirmationBar.classList.remove('translate-y-full');
                }
            });
        });
    </script>
