<style>
        /* Custom Animations representing Fluid Motion Cues */
        @keyframes micro-breathe {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.02) translateY(-4px); }
        }
        @keyframes organic-float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-6px) rotate(2deg); }
            66% { transform: translateY(-2px) rotate(-1deg); }
        }
        @keyframes subtle-glow {
            0%, 100% { box-shadow: 0 10px 25px -5px rgba(45, 106, 79, 0.08); }
            50% { box-shadow: 0 15px 35px -5px rgba(45, 106, 79, 0.15); }
        }

        .animate-expressive {
            animation: micro-breathe 4s ease-in-out infinite, organic-float 6s ease-in-out infinite;
        }
        .animate-card-expressive {
            animation: subtle-glow 4s ease-in-out infinite;
        }
        
        /* Glassmorphism utility for subtle backdrop if needed */
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
