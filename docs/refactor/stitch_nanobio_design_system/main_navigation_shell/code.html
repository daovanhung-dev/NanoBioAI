<style>
        body {
            background-color: #F6FBF8;
        }
        .fade-enter {
            opacity: 0;
            transform: translateY(10px);
        }
        .fade-enter-active {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 300ms ease-out, transform 300ms ease-out;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background font-body-base antialiased pb-24 md:hidden">
<!-- Main Content Area -->
<main class="w-full max-w-md mx-auto px-page-padding pt-6 fade-enter-active" id="main-content">
<header class="mb-section-gap">
<h1 class="font-display-hero text-display-hero text-primary mb-2">Chào buổi sáng,</h1>
<p class="font-body-base text-body-base text-text-secondary">Hôm nay bạn cảm thấy thế nào?</p>
</header>
<!-- Bento Grid Example for Home -->
<div class="grid grid-cols-1 gap-sm">
<!-- Hero Card -->
<div class="bg-surface-container-lowest rounded-xl p-card-padding border border-border-soft shadow-[0_8px_20px_0_rgba(20,163,111,0.08)] relative overflow-hidden">
<div class="absolute top-0 right-0 w-32 h-32 bg-primary-soft rounded-bl-full opacity-50 -mr-8 -mt-8"></div>
<div class="flex items-center justify-between mb-4">
<span class="font-section-title text-section-title text-text-primary">Sức khỏe tổng quan</span>
<span class="material-symbols-outlined text-primary" data-icon="monitor_heart">monitor_heart</span>
</div>
<div class="flex items-end gap-2">
<span class="font-display-hero text-display-hero text-primary">85</span>
<span class="font-body-sm text-body-sm text-text-muted mb-1">/100</span>
</div>
<p class="font-body-sm text-body-sm text-text-secondary mt-2">Tuyệt vời! Bạn đang duy trì phong độ tốt.</p>
</div>
<!-- Smaller Cards Grid -->
<div class="grid grid-cols-2 gap-sm mt-sm">
<div class="bg-mint-surface rounded-xl p-card-padding flex flex-col justify-between h-32 border border-border-soft">
<span class="material-symbols-outlined text-energy-yellow" data-icon="directions_walk" style="font-variation-settings: 'FILL' 1;">directions_walk</span>
<div>
<p class="font-body-sm text-body-sm text-text-secondary">Bước chân</p>
<p class="font-section-title text-section-title text-text-primary">4,230</p>
</div>
</div>
<div class="bg-mint-surface rounded-xl p-card-padding flex flex-col justify-between h-32 border border-border-soft">
<span class="material-symbols-outlined text-personal-purple" data-icon="bedtime" style="font-variation-settings: 'FILL' 1;">bedtime</span>
<div>
<p class="font-body-sm text-body-sm text-text-secondary">Giấc ngủ</p>
<p class="font-section-title text-section-title text-text-primary">7h 20m</p>
</div>
</div>
</div>
</div>
</main>
<!-- Bottom Navigation Bar (Generated from JSON structure) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-safe pt-2 bg-surface/80 backdrop-blur-md shadow-[0_-4px_20px_0_rgba(20,163,111,0.08)] rounded-t-xl md:hidden">
<!-- Tab 1: Trang chủ (Active) -->
<button class="flex flex-col items-center justify-center bg-primary-soft text-primary rounded-full px-4 py-1 scale-[0.975] transition-all duration-200">
<span class="material-symbols-outlined mb-1" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-chip text-label-chip">Trang chủ</span>
</button>
<!-- Tab 2: Sức khỏe -->
<button class="flex flex-col items-center justify-center text-text-muted hover:text-primary transition-colors hover:opacity-80 px-4 py-1">
<span class="material-symbols-outlined mb-1" data-icon="favorite">favorite</span>
<span class="font-label-chip text-label-chip">Sức khỏe</span>
</button>
<!-- Tab 3: Nabi -->
<button class="flex flex-col items-center justify-center text-text-muted hover:text-primary transition-colors hover:opacity-80 px-4 py-1">
<span class="material-symbols-outlined mb-1" data-icon="face">face</span>
<span class="font-label-chip text-label-chip">Nabi</span>
</button>
<!-- Tab 4: Nhật ký -->
<button class="flex flex-col items-center justify-center text-text-muted hover:text-primary transition-colors hover:opacity-80 px-4 py-1">
<span class="material-symbols-outlined mb-1" data-icon="auto_stories">auto_stories</span>
<span class="font-label-chip text-label-chip">Nhật ký</span>
</button>
<!-- Tab 5: Hồ sơ -->
<button class="flex flex-col items-center justify-center text-text-muted hover:text-primary transition-colors hover:opacity-80 px-4 py-1">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-chip text-label-chip">Hồ sơ</span>
</button>

<script>
        // Simple mock interaction to demonstrate the transition effect
        document.querySelectorAll('nav button').forEach(button => {
            button.addEventListener('click', function() {
                // Remove active classes from all buttons
                document.querySelectorAll('nav button').forEach(btn => {
                    btn.className = "flex flex-col items-center justify-center text-text-muted hover:text-primary transition-colors hover:opacity-80 px-4 py-1";
                    btn.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 0";
                });
                
                // Add active classes to clicked button
                this.className = "flex flex-col items-center justify-center bg-primary-soft text-primary rounded-full px-4 py-1 scale-[0.975] transition-all duration-200";
                this.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1";

                // Trigger fade animation on main content
                const mainContent = document.getElementById('main-content');
                mainContent.classList.remove('fade-enter-active');
                mainContent.classList.add('fade-enter');
                
                setTimeout(() => {
                    mainContent.classList.remove('fade-enter');
                    mainContent.classList.add('fade-enter-active');
                    // In a real app, content would change here
                }, 50);
            });
        });
    </script>
