<style>
        .nabi-breathe {
            animation: microBreathe 4s infinite ease-in-out;
        }
        @keyframes microBreathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        .ghost-trace {
            stroke-dasharray: 4 4;
            animation: dashMove 1s linear infinite;
        }
        @keyframes dashMove {
            to { stroke-dashoffset: -8; }
        }
        .snap-ripple {
            animation: snapRipple 0.6s ease-out forwards;
        }
        @keyframes snapRipple {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }
    </style>

                Demonstrating the free-floating Nabi mascot. It avoids system UI elements and snaps to the edge of the screen, staying out of the way of primary content.
            </p>
</div>
<!-- Demonstration of Ghost Trace & Snap Points -->
<svg class="absolute inset-0 w-full h-full pointer-events-none z-10" height="100%" width="100%">
<!-- Trace path showing drag motion from center to right edge -->
<path class="ghost-trace opacity-60" d="M 150 300 Q 250 250 320 400" fill="none" stroke="#95d4b3" stroke-linecap="round" stroke-width="3"></path>
<!-- Previous locations (ghosts) -->
<circle cx="150" cy="300" fill="#e8e1db" opacity="0.3" r="28"></circle>
<circle cx="220" cy="270" fill="#e8e1db" opacity="0.4" r="28"></circle>
<circle cx="280" cy="320" fill="#e8e1db" opacity="0.5" r="28"></circle>
<!-- Snap ripple effect at final destination -->

<script>
        // Simple drag interaction logic for demonstration
        const mascot = document.getElementById('nabi-mascot');
        let isDragging = false;
        let startX, startY, initialX, initialY;

        mascot.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            initialX = mascot.offsetLeft;
            initialY = mascot.offsetTop;
            mascot.classList.remove('nabi-breathe', 'transition-transform');
            mascot.style.transform = 'scale(1.05)';
        });

        document.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            e.preventDefault(); // Prevent scrolling while dragging
            const currentX = e.touches[0].clientX;
            const currentY = e.touches[0].clientY;
            const dx = currentX - startX;
            const dy = currentY - startY;
            mascot.style.left = `${initialX + dx}px`;
            mascot.style.top = `${initialY + dy}px`;
        }, { passive: false });

        document.addEventListener('touchend', () => {
            if (!isDragging) return;
            isDragging = false;
            mascot.style.transform = 'scale(1)';
            mascot.classList.add('nabi-breathe', 'transition-transform');
            
            // Snap logic (simplified)
            const rect = mascot.getBoundingClientRect();
            const screenWidth = window.innerWidth;
            const margin = 16;
            
            // Snap to left or right
            if (rect.left + rect.width / 2 < screenWidth / 2) {
                mascot.style.left = `${margin}px`;
            } else {
                mascot.style.left = `${screenWidth - rect.width - margin}px`;
            }

            // Ensure it stays above bottom nav
            const bottomNavHeight = 80;
            const maxTop = window.innerHeight - bottomNavHeight - rect.height - margin;
            if (rect.top > maxTop) {
                mascot.style.top = `${maxTop}px`;
            }
            if (rect.top < margin + 64) { // keep below top bar
                mascot.style.top = `${margin + 64}px`;
            }
        });
    </script>
