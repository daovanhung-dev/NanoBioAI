<style>
        /* Custom range slider styling */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #008559; /* primary-container */
            cursor: pointer;
            margin-top: -10px; /* You need to specify a margin in Chrome, but in Firefox and IE it is automatic */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #DDF6E9; /* primary-soft */
            border-radius: 2px;
        }

        /* Initial scale variables */
        :root {
            --preview-scale: 1;
        }

        .preview-text-scaled {
            transform: scale(var(--preview-scale));
            transform-origin: top left;
            transition: transform 0.2s ease-out;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-base min-h-screen flex flex-col antialiased">
<!-- Main Container -->
<main class="flex-grow flex flex-col px-page-padding pt-12 pb-8 max-w-md mx-auto w-full">
<!-- Header Section -->
<header class="mb-section-gap text-center">
<h1 class="font-screen-title text-screen-title text-text-primary mb-sm">
                Cỡ chữ nào phù hợp với bạn?
            </h1>
<p class="font-body-base text-body-base text-text-secondary">
                Hãy chọn kích thước chữ dễ đọc nhất để Nabi hỗ trợ bạn tốt hơn.
            </p>
</header>
<!-- Preview Area (Bento Card) -->
<div class="bg-surface-lowest rounded-xl border border-border-soft p-card-padding shadow-[0_4px_20px_0_rgba(20,163,111,0.08)] mb-section-gap flex-grow relative overflow-hidden flex flex-col bg-white">
<div class="flex items-center gap-sm mb-md pb-sm border-b border-border-soft">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">eco</span>
<h2 class="font-section-title text-section-title text-text-primary">Mẹo Sức Khỏe Hôm Nay</h2>
</div>
<!-- Scalable Content Container -->
<div class="preview-text-scaled flex-grow" id="previewContainer">
<p class="font-body-base text-body-base text-text-secondary mb-md">
                    Uống đủ nước mỗi ngày giúp cải thiện chức năng não bộ, duy trì mức năng lượng và giữ cho làn da của bạn luôn khỏe mạnh.
                </p>
<div class="bg-mint-surface p-sm rounded-lg flex items-start gap-sm">
<span class="material-symbols-outlined text-primary mt-xs" style="font-variation-settings: 'FILL' 1;">water_drop</span>
<div>
<strong class="block font-body-sm text-body-sm text-on-tertiary-fixed-variant font-semibold">Mục tiêu của bạn</strong>
<span class="font-body-sm text-body-sm text-text-secondary">2 lít / ngày</span>
</div>
</div>
</div>
</div>
<!-- Control Area -->
<div class="mb-section-gap mt-auto">
<div class="flex justify-between items-end mb-sm px-2 text-text-primary">
<span class="font-body-sm text-body-sm font-medium">A</span>

</div>
<div class="relative px-2">
<input aria-label="Điều chỉnh cỡ chữ" class="w-full appearance-none bg-transparent" id="textSizeSlider" max="1.5" min="0.8" step="0.1" type="range" value="1.0">
<!-- Decorative tick marks (optional, for visual polish) -->

<button class="w-full bg-gradient-to-r from-primary to-primary-fixed-dim text-on-primary font-cta text-cta py-4 rounded-full shadow-[0_8px_20px_-4px_rgba(20,163,111,0.3)] hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-sm">
                Tiếp tục

</button>

</main>
<!-- Navigation Suppressed for Onboarding/Transactional flow -->
<script>
        const slider = document.getElementById('textSizeSlider');
        const root = document.documentElement;

        slider.addEventListener('input', function() {
            root.style.setProperty('--preview-scale', this.value);
        });
    </script>
