<style>
        .fab-gradient {
            background: linear-gradient(135deg, #0F8E62 0%, #32C789 100%);
        }
        
        .fab-shadow {
            box-shadow: 0 8px 24px rgba(45, 106, 79, 0.25);
        }

        .micro-breathing {
            animation: breathe 3s ease-in-out infinite;
        }

        @keyframes breathe {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .thinking-ring {
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 9999px;
            border: 2px solid #32C789;
            opacity: 0;
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.9);
                opacity: 0.8;
            }
            70% {
                transform: scale(1.3);
                opacity: 0;
            }
            100% {
                transform: scale(0.9);
                opacity: 0;
            }
        }
        
        .bouncing-dots span {
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .bouncing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .bouncing-dots span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex flex-col items-center justify-center gap-xl p-lg font-body-md text-on-background relative">
<div class="text-center mb-lg">
<h1 class="font-headline-lg text-headline-lg text-primary mb-sm">Nabi Companion FAB</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Floating Action Button States</p>
</div>
<div class="flex flex-col md:flex-row gap-xl items-center justify-center p-xl bg-surface-container rounded-xl border border-outline-variant/30">
<!-- Idle State -->
<div class="flex flex-col items-center gap-md">
<h2 class="font-label-md text-label-md text-on-surface-variant">Idle State</h2>
<div class="relative w-16 h-16 flex items-center justify-center">
<!-- FAB -->
<button aria-label="Open Nabi Chat" class="w-touch-target h-touch-target rounded-full fab-gradient fab-shadow text-on-primary flex items-center justify-center hover:scale-[1.05] transition-transform duration-300 ease-out micro-breathing focus:outline-none focus:ring-4 focus:ring-primary-container/30">
<div class="relative flex items-center justify-center">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">chat_bubble</span>
<!-- Tiny Sprout Overlay -->
<span class="material-symbols-outlined text-[14px] absolute -top-1 -right-1 text-surface" style="font-variation-settings: 'FILL' 1;">psychiatry</span>
</div>
</button>
</div>
</div>
<div class="w-px h-16 bg-outline-variant/50 hidden md:block"></div>
<div class="h-px w-16 bg-outline-variant/50 block md:hidden"></div>
<!-- Thinking State -->
<div class="flex flex-col items-center gap-md">
<h2 class="font-label-md text-label-md text-on-surface-variant">Thinking State</h2>
<div class="relative w-16 h-16 flex items-center justify-center">
<!-- Pulse Ring -->
<div class="thinking-ring"></div>
<!-- FAB -->
<button aria-label="Nabi is thinking" class="w-touch-target h-touch-target rounded-full fab-gradient fab-shadow text-on-primary flex items-center justify-center focus:outline-none" disabled="">
<div class="relative flex items-center justify-center">
<span class="material-symbols-outlined text-[24px] opacity-0" style="font-variation-settings: 'FILL' 1;">chat_bubble</span>
<!-- Typing Indicator replacing icon -->
<div class="absolute inset-0 flex items-center justify-center gap-[3px] bouncing-dots">
<span class="w-1.5 h-1.5 bg-on-primary rounded-full"></span>
<span class="w-1.5 h-1.5 bg-on-primary rounded-full"></span>
<span class="w-1.5 h-1.5 bg-on-primary rounded-full"></span>
</div>
</div>
</button>
</div>
</div>
</div>
<!-- Contextual Demo Container -->
<div class="mt-xl w-full max-w-md h-96 bg-surface rounded-xl border border-outline-variant/30 relative overflow-hidden flex flex-col shadow-sm">
<!-- Mock Top App Bar -->
<div class="h-16 w-full flex items-center justify-between px-md border-b border-surface-variant bg-surface-container-lowest">
<div class="flex items-center gap-sm">
<div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container font-bold text-sm">N</div>
<span class="font-headline-md text-headline-md text-primary">Nabi</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant">settings</span>
</div>
<!-- Mock Content -->
<div class="flex-1 p-lg bg-background">
<div class="w-3/4 h-8 bg-surface-container rounded-lg mb-4"></div>
<div class="w-full h-24 bg-surface-container rounded-xl border border-secondary-container/50"></div>
<div class="mt-8 flex gap-2">
<div class="w-16 h-8 bg-primary-container/20 rounded-full"></div>
<div class="w-24 h-8 bg-primary-container/20 rounded-full"></div>
</div>
</div>
<!-- Simulated Floating Position in bottom right -->
<div class="absolute bottom-6 right-6 z-50">
<!-- Active Demo FAB -->
<button class="w-touch-target h-touch-target rounded-full fab-gradient fab-shadow text-on-primary flex items-center justify-center hover:scale-[1.05] transition-transform duration-300 ease-out focus:outline-none" id="demo-fab">
<div class="relative flex items-center justify-center" id="fab-icon-container">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">chat_bubble</span>
<span class="material-symbols-outlined text-[14px] absolute -top-1 -right-1 text-surface" style="font-variation-settings: 'FILL' 1;">psychiatry</span>
</div>
</button>
<div class="hidden absolute top-[-4px] left-[-4px] right-[-4px] bottom-[-4px] rounded-full border-2 border-[#32C789] opacity-0" id="demo-ring" style="animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;"></div>
</div>
</div>
<p class="text-label-sm font-label-sm text-outline mt-sm">Click the FAB in the mock container to toggle states.</p>
<script>
        const demoFab = document.getElementById('demo-fab');
        const iconContainer = document.getElementById('fab-icon-container');
        const demoRing = document.getElementById('demo-ring');
        let isThinking = false;

        demoFab.addEventListener('click', () => {
            isThinking = !isThinking;
            
            if (isThinking) {
                // Switch to thinking state
                demoRing.classList.remove('hidden');
                demoFab.classList.remove('hover:scale-[1.05]'); // Disable hover effect while thinking
                iconContainer.innerHTML = `
                    <div class="flex items-center justify-center gap-[3px] bouncing-dots">
                        <span class="w-1.5 h-1.5 bg-on-primary rounded-full"></span>
                        <span class="w-1.5 h-1.5 bg-on-primary rounded-full"></span>
                        <span class="w-1.5 h-1.5 bg-on-primary rounded-full"></span>
                    </div>
                `;
            } else {
                // Switch to idle state
                demoRing.classList.add('hidden');
                demoFab.classList.add('hover:scale-[1.05]');
                iconContainer.innerHTML = `
                    <span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">chat_bubble</span>
                    <span class="material-symbols-outlined text-[14px] absolute -top-1 -right-1 text-surface" style="font-variation-settings: 'FILL' 1;">psychiatry</span>
                `;
            }
        });
    </script>
</body></html>
