<body class="bg-background text-on-background font-body-base h-screen flex flex-col items-center justify-center overflow-hidden">
<!-- Main Container -->
<main class="w-full max-w-md mx-auto h-full flex flex-col relative bg-surface-lowest shadow-2xl overflow-hidden rounded-none sm:rounded-2xl sm:h-[850px] sm:my-auto">
<!-- Background Pattern -->
<div class="absolute inset-0 z-0 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(#14A36F 1px, transparent 1px); background-size: 20px 20px;"></div>
<!-- Top Progress Bar -->
<div class="z-10 w-full px-page-padding pt-12 pb-4 flex justify-between items-center bg-transparent">
<button class="text-text-secondary hover:bg-surface-container rounded-full p-2 transition-colors">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex items-center gap-xs text-body-sm font-body-sm text-text-secondary">
<span class="font-bold text-primary">0</span> <span>/</span> <span>10</span>
</div>
<div class="w-10"></div> <!-- Spacer -->
</div>
<!-- Content Area -->
<div class="flex-1 flex flex-col items-center justify-center px-page-padding z-10 w-full mb-20 mt-[-40px]">
<!-- Hero Image / Mascot -->
<div class="relative w-64 h-64 mb-section-gap flex items-center justify-center">
<!-- Soft Glow behind image -->
<div class="absolute inset-0 bg-primary-soft rounded-full blur-3xl opacity-50"></div>
<img class="w-full h-full object-contain relative z-10 drop-shadow-xl animate-[pulse_3s_ease-in-out_infinite]" data-alt="A stylized, modern, 3D rendered character of a friendly, abstract wellness companion mascot named Nabi. The mascot features soft, rounded organic shapes primarily in a restorative natural green color palette, specifically incorporating hex #14A36F tones. It is set against a clean, light-mode white background with subtle ambient studio lighting creating a warm, non-judgmental, and approachable feel, perfectly suited for a high-impact hero screen in a modern corporate health app." src="https://lh3.googleusercontent.com/aida-public/AB6AXuACajQuN6px7hyrNWx29WO8UA-X3D4wxRUeeyK5Sxlba4WfoPFmUAzNHbx1PG0TOzGTumd5WYeeiOCMkQLI_-o7_Hhxp6Q14L0rm0_dydXFe4xOn8L_wRGwYkyMULcXi3zAlnzLFZGfbR3oRVcmkfeeoKuI7lZDqQ2x0_PgKay1MiLyttt9336MM8Skc1aXoYl-ux-wGbLKd4s-BCzQiTyJLk6yURXae_xIiqMnwIoL1KcBGXd6RatsWQ" style="transition: 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); opacity: 1; transform: translateY(0px);">
</div>
<!-- Typography -->

<h1 class="font-display-hero text-display-hero text-text-primary text-hero-gradient">Chào bạn, mình là Nabi!</h1>
<p class="font-body-base text-body-base text-text-secondary leading-relaxed">
                    Cùng mình xây dựng lối sống lành mạnh và khoa học chỉ trong vài phút.
                </p>
</div>
</div>
<!-- Bottom Action Area -->

<span class="material-symbols-outlined text-on-primary" data-icon="arrow_forward">arrow_forward</span>
</button>

<script>
        // Simple subtle entrance animation
        document.addEventListener('DOMContentLoaded', () => {
            const mascot = document.querySelector('img');
            const texts = document.querySelectorAll('h1, p');
            const btn = document.querySelector('button.hero-gradient');

            if(mascot) {
                mascot.style.opacity = '0';
                mascot.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    mascot.style.transition = 'all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1)';
                    mascot.style.opacity = '1';
                    mascot.style.transform = 'translateY(0)';
                }, 100);
            }

            texts.forEach((text, index) => {
                text.style.opacity = '0';
                text.style.transform = 'translateY(10px)';
                setTimeout(() => {
                    text.style.transition = 'all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1)';
                    text.style.opacity = '1';
                    text.style.transform = 'translateY(0)';
                }, 300 + (index * 150));
            });

             if(btn) {
                btn.style.opacity = '0';
                btn.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    btn.style.transition = 'all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1)';
                    btn.style.opacity = '1';
                    btn.style.transform = 'translateY(0)';
                }, 600);
            }
        });
    </script>
