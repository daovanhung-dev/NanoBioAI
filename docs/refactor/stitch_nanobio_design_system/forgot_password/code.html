    body {

<body class="bg-surface min-h-screen flex flex-col justify-center items-center text-on-surface">
<!-- Main Content Container -->
<main class="w-full max-w-md px-page-padding py-section-gap flex flex-col items-center">
<!-- Icon / Mascot Area -->
<div class="mb-lg w-24 h-24 rounded-full bg-mint-surface flex items-center justify-center border border-border-soft shadow-sm">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">
                lock_reset
            </span>
</div>
<!-- Headers -->
<div class="text-center mb-xl w-full">
<h1 class="font-display-hero text-display-hero text-text-primary mb-sm">Quên mật khẩu?</h1>
<p class="font-body-base text-body-base text-text-secondary">
                Đừng lo lắng. Vui lòng nhập địa chỉ email liên kết với tài khoản của bạn, chúng tôi sẽ gửi một liên kết để khôi phục mật khẩu an toàn.
            </p>
</div>
<!-- Form Section -->
<form class="w-full bg-surface-container-lowest p-card-padding rounded-xl shadow-lg border border-border-soft relative" style="box-shadow: 0 8px 20px rgba(20, 163, 111, 0.08);">
<div class="mb-lg relative">
<!-- Floating Label Input -->
<div class="relative">
<input class="peer w-full px-md pt-lg pb-sm bg-transparent border border-outline-variant rounded-lg text-text-primary focus:outline-none focus:border-primary focus:ring-1 focus:ring-focus-ring transition-all placeholder-transparent" id="email" name="email" placeholder="Email của bạn" required="" type="email">
<label class="absolute left-md top-xs text-text-muted font-body-sm text-body-sm transition-all peer-placeholder-shown:top-md peer-placeholder-shown:text-body-base peer-focus:top-xs peer-focus:text-body-sm peer-focus:text-primary cursor-text" for="email">
                        Địa chỉ Email
                    </label>
</div>
<p class="font-body-sm text-body-sm text-text-muted mt-xs ml-xs">Chúng tôi sẽ gửi một email xác nhận đến địa chỉ này.</p>
</div>
<!-- Primary CTA -->
<button class="w-full py-md px-lg rounded-full font-cta text-cta text-on-primary shadow-md hover:opacity-90 active:scale-95 transition-all flex items-center justify-center gap-sm" style="background: linear-gradient(135deg, #0F8E62 0%, #32C789 100%);" type="button">
<span>Gửi liên kết khôi phục</span>
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">
                    send
                </span>
</button>
</form>
<!-- Back to Login Link -->
<div class="mt-lg text-center">
<a class="font-body-base text-body-base text-primary hover:text-primary-container transition-colors inline-flex items-center gap-xs" href="#">
<span class="material-symbols-outlined text-[20px]">
                    arrow_back
                </span>
                Quay lại đăng nhập
            </a>
</div>
