<style>
        .orb-idle {
            animation: pulse-idle 3s infinite ease-in-out;
            background: radial-gradient(circle, rgba(0,106,70,0.8) 0%, rgba(104,217,165,0.4) 100%);
            box-shadow: 0 0 40px rgba(0,106,70,0.3);
        }
        
        .orb-listening {
            animation: ripple-listen 1.5s infinite ease-in-out;
            background: radial-gradient(circle, rgba(0,133,89,1) 0%, rgba(127,249,190,0.6) 100%);
            box-shadow: 0 0 60px rgba(0,133,89,0.5);
        }
        
        .orb-processing {
            animation: spin-process 2s infinite linear;
            background: conic-gradient(from 0deg, transparent 0%, rgba(0,106,70,1) 50%, transparent 100%);
            border-radius: 50%;
            padding: 4px;
        }
        
        .orb-speaking {
            animation: expand-speak 0.8s infinite alternate ease-in-out;
            background: radial-gradient(circle, rgba(20,136,95,0.9) 0%, rgba(167,242,209,0.5) 100%);
            box-shadow: 0 0 80px rgba(20,136,95,0.6);
        }
        
        .orb-error {
            animation: shake-error 0.5s ease-in-out;
            background: radial-gradient(circle, rgba(198,74,74,0.8) 0%, rgba(255,125,117,0.4) 100%);
            box-shadow: 0 0 40px rgba(198,74,74,0.4);
        }

        @keyframes pulse-idle {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        @keyframes ripple-listen {
            0% { box-shadow: 0 0 0 0 rgba(0,133,89, 0.4); }
            70% { box-shadow: 0 0 0 40px rgba(0,133,89, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0,133,89, 0); }
        }

        @keyframes spin-process {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes expand-speak {
            0% { transform: scale(1); border-radius: 50%; }
            100% { transform: scale(1.1) scaleY(1.05); border-radius: 45%; }
        }
        
        @keyframes shake-error {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>

<script>
        const states = ['idle', 'listening', 'processing', 'speaking', 'error'];
        let currentStateIndex = 1; // Start with listening for demo

        const orb = document.getElementById('voice-orb');
        const processingRing = document.getElementById('processing-ring');
        const orbIcon = document.getElementById('orb-icon');
        const statusText = document.getElementById('status-text');
        const transcriptContainer = document.getElementById('transcript-container');
        const transcriptText = document.getElementById('transcript-text');

        const stateConfig = {
            'idle': {
                class: 'orb-idle',
                icon: 'mic_none',
                text: 'Chạm để nói chuyện',
                transcriptText: '',
                showTranscript: false
            },
            'listening': {
                class: 'orb-listening',
                icon: 'mic',
                text: 'Tôi đang lắng nghe...',
                transcriptText: '"Hôm nay tôi cảm thấy..."',
                showTranscript: true
            },
            'processing': {
                class: 'bg-transparent', // Handled by ring
                icon: 'graphic_eq',
                text: 'Đang suy nghĩ...',
                transcriptText: '"Hôm nay tôi cảm thấy hơi mệt mỏi..."',
                showTranscript: true
            },
            'speaking': {
                class: 'orb-speaking',
                icon: 'volume_up',
                text: 'NaBi đang trả lời...',
                transcriptText: 'Bạn nên nghỉ ngơi một chút nhé. Uống một ngụm nước ấm sẽ giúp bạn thấy tốt hơn.',
                showTranscript: true
            },
            'error': {
                class: 'orb-error',
                icon: 'warning',
                text: 'Không nghe rõ, vui lòng thử lại',
                transcriptText: 'Lỗi kết nối hoặc không nhận diện được giọng nói.',
                showTranscript: true
            }
        };

        function cycleState() {
            // Remove current classes
            const currentState = states[currentStateIndex];
            orb.classList.remove(stateConfig[currentState].class);
            
            // Advance state
            currentStateIndex = (currentStateIndex + 1) % states.length;
            const newState = states[currentStateIndex];
            const config = stateConfig[newState];

            // Apply new state
            if (newState === 'processing') {
                orb.classList.remove('orb-idle', 'orb-listening', 'orb-speaking', 'orb-error');
                orb.style.background = 'transparent';
                orb.style.boxShadow = 'none';
                processingRing.classList.remove('hidden');
                orbIcon.style.opacity = '0.4';
                orbIcon.style.color = '#006a46'; // Primary color for icon when transparent bg
            } else {
                processingRing.classList.add('hidden');
                orb.style.background = ''; // reset inline style
                orb.style.boxShadow = '';
                orb.classList.add(config.class);
                orbIcon.style.opacity = '0.8';
                orbIcon.style.color = '#ffffff'; // White for colored backgrounds
            }

            orbIcon.textContent = config.icon;
            statusText.textContent = config.text;
            
            if (config.showTranscript) {
                transcriptText.textContent = config.transcriptText;
                transcriptContainer.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
                transcriptContainer.classList.add('opacity-100', 'translate-y-0');
                
                if(newState === 'error') {
                    transcriptContainer.style.borderColor = 'rgba(198,74,74,0.3)';
                    transcriptText.classList.replace('text-text-primary', 'text-error');
                } else if (newState === 'speaking') {
                     transcriptContainer.style.borderColor = 'rgba(20,136,95,0.3)';
                     transcriptText.classList.replace('text-error', 'text-text-primary');
                } else {
                    transcriptContainer.style.borderColor = 'rgba(255, 255, 255, 0.3)';
                    transcriptText.classList.replace('text-error', 'text-text-primary');
                }
            } else {
                transcriptContainer.classList.remove('opacity-100', 'translate-y-0');
                transcriptContainer.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
            }
        }
    </script>
