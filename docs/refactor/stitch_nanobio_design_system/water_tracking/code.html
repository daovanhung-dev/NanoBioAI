<script>
        // Simple interaction script to demonstrate adding water
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('.grid button');
            const fillElement = document.querySelector('.water-fill');
            const valueElement = document.querySelector('.font-display-hero');
            const progressElement = document.querySelector('.bg-gradient-to-r');
            const percentageElement = document.querySelector('.font-label-chip.font-bold');
            
            let currentVolume = 1.2;
            const maxVolume = 2.0;

            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Extract value from button text (e.g., "+200ml" -> 0.2)
                    const text = btn.querySelector('.font-cta').innerText;
                    const amount = parseInt(text.replace(/[^0-9]/g, '')) / 1000;
                    
                    if (currentVolume < maxVolume) {
                        currentVolume = Math.min(currentVolume + amount, maxVolume);
                        const percentage = (currentVolume / maxVolume) * 100;
                        
                        // Update UI
                        valueElement.innerText = currentVolume.toFixed(1);
                        fillElement.style.height = `${percentage}%`;
                        progressElement.style.width = `${percentage}%`;
                        percentageElement.innerText = `${Math.round(percentage)}%`;

                        // Optional: Add a temporary success state to the button
                        const originalBg = btn.className;
                        btn.classList.add('bg-mint-surface', 'border-primary');
                        setTimeout(() => {
                            btn.className = originalBg;
                        }, 300);
                    }
                });
            });
        });
    </script>
