<!-- Main Content Area -->

<!-- Content Cards -->

</a>

<span class="font-label-sm text-label-sm">Hỗ trợ</span>
</a>

<script>
        // Simple logic to demonstrate Nabi's behavior
        document.addEventListener('DOMContentLoaded', () => {
            const nabiBubble = document.getElementById('nabi-bubble');
            const nabiContainer = document.getElementById('nabi-container');
            const inputField = document.getElementById('note');
            const keyboardZone = document.getElementById('keyboard-zone');

            // Show speech bubble shortly after load
            setTimeout(() => {
                nabiBubble.classList.remove('opacity-0', 'translate-y-2');
            }, 1500);

            // Hide bubble after a few seconds
            setTimeout(() => {
                 nabiBubble.classList.add('opacity-0', 'translate-y-2');
            }, 5000);

            // Simulate keyboard appearing and companion hiding
            inputField.addEventListener('focus', () => {
                nabiContainer.style.transform = 'translateY(100px) scale(0.8)';
                nabiContainer.style.opacity = '0';
                nabiContainer.style.pointerEvents = 'none';
                
                // Show exclusion zone for demonstration
                // keyboardZone.classList.remove('hidden');
            });

            inputField.addEventListener('blur', () => {
                nabiContainer.style.transform = 'translateY(0) scale(1)';
                nabiContainer.style.opacity = '1';
                nabiContainer.style.pointerEvents = 'auto';
                
                // Hide exclusion zone
                // keyboardZone.classList.add('hidden');
            });
        });
    </script>
