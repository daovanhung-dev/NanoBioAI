<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--tw-colors-border-soft);
        }
        .form-input:focus {
            box-shadow: 0 0 0 4px var(--tw-colors-focus-ring);
        }
        .loading-spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .slide-up {
            animation: slideUp 0.3s ease-out forwards;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-surface text-on-surface antialiased font-body-base min-h-screen flex items-end sm:items-center justify-center p-0 sm:p-page-padding">
<!-- Modal Backdrop -->
<div class="fixed inset-0 bg-inverse-surface/40 backdrop-blur-sm z-40 transition-opacity" id="modalBackdrop"></div>
<!-- Edit Profile Sheet -->
<div class="relative w-full max-w-md bg-surface-container-lowest rounded-t-3xl sm:rounded-3xl shadow-[0_-8px_30px_rgba(20,163,111,0.12)] sm:shadow-[0_8px_30px_rgba(20,163,111,0.12)] z-50 flex flex-col max-h-[795px] slide-up overflow-hidden border border-border-soft" id="editProfileSheet">
<!-- Drag Handle (Mobile) -->
<div class="w-full flex justify-center pt-3 pb-1 sm:hidden">
<div class="w-12 h-1.5 bg-surface-variant rounded-full"></div>
</div>
<!-- Header -->
<header class="flex items-center justify-between px-page-padding py-4 border-b border-surface-container">
<button aria-label="Đóng" class="p-2 -ml-2 text-text-secondary hover:text-primary transition-colors rounded-full hover:bg-surface-container-low">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<h1 class="font-section-title text-section-title text-text-primary">Chỉnh sửa hồ sơ</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Content Scrollable Area -->
<div class="flex-1 overflow-y-auto px-page-padding py-section-gap space-y-6">
<!-- Avatar Edit -->
<div class="flex flex-col items-center justify-center space-y-4">
<div class="relative group cursor-pointer">
<img alt="Avatar" class="w-24 h-24 rounded-full object-cover border-4 border-surface-container-lowest shadow-sm" data-alt="A close-up portrait of an Asian woman smiling warmly. The lighting is soft and natural, evoking a fresh, morning atmosphere. The background is slightly blurred with soft green and white hues, consistent with a clean, modern health and wellness app aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDE0hSOhFwQ7RUk3bPNQclMmJ5xzTdXbiYd4ucjf0TZdRHy7ZY15SaCwgK2qIu3lHDVmRRLgP67BFLprLD_fKh1CuRLnm2EXTy-5D48dRKQQt1Fi-ISC5Y5aDa-g1riC63nSdHvh3W8N5t2S-XvpCHFVcvxZ6EeEasH6Ay08bd8mtkH_9SmKgaYmGL6DKj4c0-kFwKWyBWsh7vAGcX0ZK3dEumbDR6VDvnLJdJsui15c2eck1gh0yHTkQ">
<div class="absolute inset-0 bg-inverse-surface/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-on-primary" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</div>
</div>
<button class="text-primary font-cta text-cta hover:text-primary-container transition-colors">Đổi ảnh đại diện</button>
</div>
<!-- Form -->
<form class="space-y-5" id="profileForm">
<!-- Name Input -->
<div class="space-y-1.5">
<label class="font-label-chip text-label-chip text-text-secondary block" for="fullName">Họ và tên</label>
<div class="relative">
<input class="w-full bg-mint-surface border border-border-soft rounded-xl px-4 py-3 text-text-primary font-body-base focus:outline-none focus:border-primary form-input transition-all placeholder:text-text-muted" id="fullName" type="text" value="Nguyễn Văn A">
<div class="absolute right-3 top-1/2 -translate-y-1/2 text-success hidden" id="nameSuccessIcon">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<p class="font-body-sm text-body-sm text-text-muted px-1">Tên hiển thị trong cộng đồng NaBi.</p>
</div>
<!-- DOB Input -->
<div class="space-y-1.5">
<label class="font-label-chip text-label-chip text-text-secondary block" for="dob">Ngày sinh</label>
<div class="relative">
<input class="w-full bg-surface-container-low border border-border-soft rounded-xl px-4 py-3 text-text-primary font-body-base focus:outline-none focus:border-primary form-input transition-all" id="dob" type="date" value="1990-01-01">
<!-- Custom calendar icon placeholder (native date input usually has one, but styling varies) -->
</div>
</div>
<!-- Goal Select/Cards (Bento Style) -->
<div class="space-y-3">
<label class="font-label-chip text-label-chip text-text-secondary block">Mục tiêu sức khỏe chính</label>
<div class="grid grid-cols-2 gap-3">
<!-- Goal Option 1 -->
<label class="cursor-pointer relative">
<input checked="" class="peer sr-only" name="healthGoal" type="radio" value="weight">
<div class="h-full p-4 rounded-xl border border-border-soft bg-surface-container-lowest peer-checked:bg-mint-surface peer-checked:border-primary transition-all flex flex-col items-start gap-2 hover:bg-surface-container-low">
<div class="w-8 h-8 rounded-full bg-primary-soft text-primary flex items-center justify-center mb-1">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">monitor_weight</span>
</div>
<span class="font-cta text-cta text-text-primary">Kiểm soát cân nặng</span>
<div class="absolute top-3 right-3 opacity-0 peer-checked:opacity-100 text-primary transition-opacity">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</label>
<!-- Goal Option 2 -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="healthGoal" type="radio" value="sleep">
<div class="h-full p-4 rounded-xl border border-border-soft bg-surface-container-lowest peer-checked:bg-mint-surface peer-checked:border-primary transition-all flex flex-col items-start gap-2 hover:bg-surface-container-low">
<div class="w-8 h-8 rounded-full bg-[#EBF4FF] text-calm-blue flex items-center justify-center mb-1">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">bedtime</span>
</div>
<span class="font-cta text-cta text-text-primary">Cải thiện giấc ngủ</span>
<div class="absolute top-3 right-3 opacity-0 peer-checked:opacity-100 text-primary transition-opacity">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</label>
<!-- Goal Option 3 -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="healthGoal" type="radio" value="energy">
<div class="h-full p-4 rounded-xl border border-border-soft bg-surface-container-lowest peer-checked:bg-mint-surface peer-checked:border-primary transition-all flex flex-col items-start gap-2 hover:bg-surface-container-low">
<div class="w-8 h-8 rounded-full bg-[#FFF7E5] text-energy-yellow flex items-center justify-center mb-1">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
<span class="font-cta text-cta text-text-primary">Tăng năng lượng</span>
<div class="absolute top-3 right-3 opacity-0 peer-checked:opacity-100 text-primary transition-opacity">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</label>
<!-- Goal Option 4 -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="healthGoal" type="radio" value="general">
<div class="h-full p-4 rounded-xl border border-border-soft bg-surface-container-lowest peer-checked:bg-mint-surface peer-checked:border-primary transition-all flex flex-col items-start gap-2 hover:bg-surface-container-low">
<div class="w-8 h-8 rounded-full bg-primary-soft text-primary flex items-center justify-center mb-1">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
<span class="font-cta text-cta text-text-primary">Sức khỏe tổng quát</span>
<div class="absolute top-3 right-3 opacity-0 peer-checked:opacity-100 text-primary transition-opacity">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</label>
</div>
</div>
</form>
<div class="h-4"></div> <!-- Extra scroll padding -->
</div>
<!-- Footer Actions -->
<div class="p-page-padding border-t border-surface-container bg-surface-container-lowest glass-panel z-10">
<button class="w-full bg-gradient-to-r from-primary-container to-primary text-on-primary font-cta text-cta py-4 rounded-xl shadow-[0_8px_20px_rgba(20,163,111,0.16)] hover:opacity-90 transition-all flex items-center justify-center gap-2 relative overflow-hidden" id="saveBtn">
<span id="saveBtnText">Lưu thay đổi</span>
<div class="loading-spinner hidden" id="saveBtnSpinner"></div>
<span class="material-symbols-outlined hidden" id="saveBtnSuccess" style="font-variation-settings: 'FILL' 1;">check</span>
</button>
</div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const saveBtn = document.getElementById('saveBtn');
            const saveBtnText = document.getElementById('saveBtnText');
            const saveBtnSpinner = document.getElementById('saveBtnSpinner');
            const saveBtnSuccess = document.getElementById('saveBtnSuccess');
            const nameInput = document.getElementById('fullName');
            const nameSuccessIcon = document.getElementById('nameSuccessIcon');

            // Simple validation simulation
            nameInput.addEventListener('input', (e) => {
                if(e.target.value.length > 2) {
                    nameSuccessIcon.classList.remove('hidden');
                } else {
                    nameSuccessIcon.classList.add('hidden');
                }
            });

            // Save button interaction
            saveBtn.addEventListener('click', () => {
                // Set pending state
                saveBtn.disabled = true;
                saveBtnText.textContent = 'Đang lưu...';
                saveBtnSpinner.classList.remove('hidden');
                saveBtn.classList.remove('from-primary-container', 'to-primary');
                saveBtn.classList.add('bg-outline'); // Muted state during save

                // Simulate API call
                setTimeout(() => {
                    // Set success state
                    saveBtnSpinner.classList.add('hidden');
                    saveBtnSuccess.classList.remove('hidden');
                    saveBtnText.textContent = 'Đã lưu thành công';
                    saveBtn.classList.remove('bg-outline');
                    saveBtn.classList.add('bg-success');

                    // Reset after 2 seconds
                    setTimeout(() => {
                        saveBtn.disabled = false;
                        saveBtnSuccess.classList.add('hidden');
                        saveBtnText.textContent = 'Lưu thay đổi';
                        saveBtn.classList.remove('bg-success');
                        saveBtn.classList.add('from-primary-container', 'to-primary');
                        
                        // Close modal simulation (optional)
                        // document.getElementById('editProfileSheet').style.transform = 'translateY(100%)';
                        // document.getElementById('modalBackdrop').style.opacity = '0';
                    }, 2000);

                }, 1500);
            });
        });
    </script>
</body></html>
