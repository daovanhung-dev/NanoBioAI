<script>
        // Simple mock progression logic for demonstration
        document.addEventListener('DOMContentLoaded', () => {
            const steps = [
                { id: 'step-1', iconId: 'step-1-icon-container', icon: 'check', title: 'Đang chuẩn bị dữ liệu', desc: 'Đang chuẩn bị...', progress: '25%' },
                { id: 'step-2', iconId: 'step-2-icon-container', icon: 'check', title: 'Đang tạo kế hoạch', desc: 'Nabi đang suy nghĩ...', progress: '50%' },
                { id: 'step-3', iconId: 'step-3-icon-container', icon: 'check', title: 'Đã lưu an toàn', desc: 'Dữ liệu bền vững...', progress: '75%' },
                { id: 'step-4', iconId: 'step-4-icon-container', icon: 'check', title: 'Sẵn sàng trải nghiệm', desc: 'Hoàn tất!', progress: '100%' }
            ];

            const titleEl = document.getElementById('status-title');
            const descEl = document.getElementById('status-desc');
            const progressEl = document.getElementById('global-progress');
            const ctaEl = document.getElementById('success-cta');

            let currentStep = 1;

            const updateStep = () => {
                if (currentStep >= steps.length) {
                    // Success state
                    titleEl.innerText = "Hoàn tất!";
                    descEl.innerText = "Kế hoạch sức khỏe cá nhân của bạn đã sẵn sàng.";
                    ctaEl.classList.remove('opacity-0', 'pointer-events-none');
                    return;
                }

                // Complete previous step
                const prevStep = steps[currentStep - 1];
                const prevEl = document.getElementById(prevStep.id);
                const prevIconContainer = document.getElementById(prevStep.iconId);
                
                if(currentStep > 0) {
                     prevIconContainer.className = "flex-shrink-0 w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center transition-colors duration-300";
                     prevIconContainer.innerHTML = `<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">check</span>`;
                }

                // Activate current step
                const currStep = steps[currentStep];
                const currEl = document.getElementById(currStep.id);
                const currIconContainer = document.getElementById(currStep.iconId);

                currEl.classList.remove('opacity-50', 'opacity-30');
                
                currIconContainer.className = "flex-shrink-0 w-8 h-8 rounded-full border-2 border-primary text-primary flex items-center justify-center bg-surface transition-colors duration-300";
                
                // Keep the original icon for the active state but spin it if it's step 2 (creating)
                let iconContent = 'refresh';
                if(currentStep === 1) iconContent = 'refresh';
                if(currentStep === 2) iconContent = 'save';
                if(currentStep === 3) iconContent = 'rocket_launch';

                currIconContainer.innerHTML = `<span class="material-symbols-outlined text-[16px] ${currentStep === 1 ? 'animate-spin' : 'animate-pulse'}">${iconContent}</span>`;

                titleEl.innerText = currStep.desc;
                progressEl.style.width = currStep.progress;

                currentStep++;
                
                // Simulate network/processing delay
                setTimeout(updateStep, 2000);
            };

            // Start the sequence after a brief pause
            setTimeout(updateStep, 2000);
        });
    </script>
