<!DOCTYPE html><html class="light" lang="vi"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Đăng ký - NaBi Wellness</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Google Fonts: Roboto -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "border-soft": "#D9E9E1",
                        "on-tertiary-fixed": "#002112",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed-dim": "#50df9c",

                        "tertiary": "#006a43",
                        "inverse-surface": "#2c3230",
                        "primary-container": "#008559",
                        "warning": "#B7791F",
                        "secondary-fixed-dim": "#8bd5b6",
                        "on-error-container": "#93000a",
                        "text-primary": "#12352A",
                        "surface-bright": "#f5faf7",
                        "calm-blue": "#58B9E8",
                        "focus-ring": "#68D9A5",
                        "primary": "#006a46",
                        "primary-soft": "#DDF6E9",
                        "surface-variant": "#dee4e1",
                        "personal-purple": "#8B7CF6",
                        "inverse-on-surface": "#edf2ef",
                        "outline": "#6d7a71",
                        "on-tertiary-fixed-variant": "#005233",
                        "surface": "#f5faf7",
                        "surface-dim": "#d6dbd8",
                        "secondary": "#1d6a51",
                        "secondary-container": "#a4efce",
                        "surface-container-highest": "#dee4e1",
                        "on-secondary-container": "#226f55",
                        "surface-tint": "#006c48",
                        "on-primary-container": "#f6fff6",
                        "surface-container": "#eaefec",
                        "error": "#C64A4A",
                        "text-secondary": "#60766E",
                        "outline-variant": "#bccabf",
                        "tertiary-fixed": "#70fcb7",
                        "primary-fixed": "#7ff9be",
                        "tertiary-container": "#008656",
                        "on-primary-fixed-variant": "#005235",
                        "care-coral": "#FF7D75",
                        "energy-yellow": "#FFC857",
                        "text-muted": "#8A9B94",
                        "surface-container-low": "#f0f5f2",
                        "on-secondary-fixed": "#002116",
                        "surface-container-high": "#e4e9e6",
                        "background": "#f5faf7",
                        "secondary-fixed": "#a7f2d1",
                        "info": "#247CA8",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "inverse-primary": "#62dda3",
                        "success": "#14885F",
                        "on-tertiary-container": "#f6fff6",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#171d1b",
                        "on-surface-variant": "#3d4a42",
                        "on-surface": "#171d1b",
                        "mint-surface": "#EAF9F1",
                        "error-container": "#ffdad6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                        "2xl": "1.25rem",
                    },
                    "spacing": {

                        "xl": "32px",

                        "xxs": "2px",
                        "section-gap": "24px",

                    "fontFamily": {
                        "body-sm": ["Roboto", "sans-serif"],
                        "screen-title": ["Roboto", "sans-serif"],
                        "label-chip": ["Roboto", "sans-serif"],

                        "display-hero": ["Roboto", "sans-serif"],
                        "body-base": ["Roboto", "sans-serif"],
                        "cta": ["Roboto", "sans-serif"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", { "lineHeight": "21px", "fontWeight": "400" }],
                        "screen-title": ["26px", { "lineHeight": "32px", "letterSpacing": "-0.4px", "fontWeight": "700" }],
                        "label-chip": ["13px", { "lineHeight": "18px", "letterSpacing": "0.1px", "fontWeight": "500" }],
                        "section-title": ["20px", { "lineHeight": "26px", "letterSpacing": "-0.2px", "fontWeight": "600" }],
                        "display-hero": ["32px", { "lineHeight": "38px", "letterSpacing": "-0.6px", "fontWeight": "700" }],

                        "cta": ["16px", { "lineHeight": "20px", "letterSpacing": "0.2px", "fontWeight": "600" }]
                    },
                    "boxShadow": {
                        'soft': '0 4px 20px 0 rgba(20, 163, 111, 0.08)',
                        'float': '0 8px 20px 0 rgba(20, 163, 111, 0.16)',

            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill-icon {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .gradient-btn {
            background: linear-gradient(135deg, #0F8E62 0%, #32C789 100%);
        }
        
        .input-floating-label:focus-within label,
        .input-floating-label input:not(:placeholder-shown) + label {
            transform: translateY(-120%) scale(0.85);
            color: #006a46;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-base antialiased">
<!-- Top Navigation App Bar - Nav shell suppressed as this is an auth screen -->
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-page-padding pt-12 pb-8 max-w-md mx-auto w-full">
<!-- Header Section -->
<header class="text-center mb-8 flex flex-col items-center">
<!-- Nabi Wave & Logo -->
<div class="w-24 h-24 rounded-full bg-mint-surface border border-border-soft flex items-center justify-center mb-6 shadow-soft relative overflow-hidden">
<span class="material-symbols-outlined fill-icon text-5xl text-primary" data-icon="waving_hand">waving_hand</span>
<!-- Subtle background decorative circle -->
<div class="absolute w-full h-full border-[1.5px] border-primary/20 rounded-full animate-ping opacity-75" style="animation-duration: 3s;"></div>
</div>
<h1 class="font-display-hero text-display-hero text-primary mb-3">Bắt đầu cùng Nabi</h1>
<p class="font-body-base text-body-base text-text-secondary max-w-[280px]">
                Tạo tài khoản để Nabi có thể hiểu và hỗ trợ bạn tốt nhất mỗi ngày.
            </p>
</header>
<!-- Registration Form -->
<form class="flex flex-col gap-5 flex-grow" onsubmit="event.preventDefault(); document.getElementById('register-btn').classList.add('opacity-80', 'cursor-not-allowed'); document.getElementById('btn-text').classList.add('hidden'); document.getElementById('btn-loading').classList.remove('hidden'); setTimeout(() =&gt; { document.getElementById('register-btn').classList.remove('opacity-80', 'cursor-not-allowed'); document.getElementById('btn-text').classList.remove('hidden'); document.getElementById('btn-loading').classList.add('hidden'); }, 2000);">
<!-- Name Input -->
<div class="relative bg-surface-container-lowest rounded-xl border border-border-soft px-4 py-3 shadow-sm focus-within:border-primary focus-within:ring-1 focus-within:ring-focus-ring transition-all">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-text-muted" data-icon="person">person</span>
<div class="relative w-full input-floating-label flex flex-col-reverse">
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-text-primary placeholder-transparent peer mt-1" id="name" placeholder=" " required="" type="text">
<label class="absolute left-0 text-text-secondary transition-all duration-200 transform origin-left peer-focus:-translate-y-5 peer-focus:scale-85 peer-focus:text-primary cursor-text" for="name">Họ và tên</label>
</div>
</div>
</div>
<!-- Email Input -->
<div class="relative bg-surface-container-lowest rounded-xl border border-border-soft px-4 py-3 shadow-sm focus-within:border-primary focus-within:ring-1 focus-within:ring-focus-ring transition-all">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-text-muted" data-icon="mail">mail</span>
<div class="relative w-full input-floating-label flex flex-col-reverse">
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-text-primary placeholder-transparent peer mt-1" id="email" placeholder=" " required="" type="email">
<label class="absolute left-0 text-text-secondary transition-all duration-200 transform origin-left peer-focus:-translate-y-5 peer-focus:scale-85 peer-focus:text-primary cursor-text" for="email">Email</label>
</div>
</div>
</div>
<!-- Password Input -->
<div class="relative bg-surface-container-lowest rounded-xl border border-border-soft px-4 py-3 shadow-sm focus-within:border-primary focus-within:ring-1 focus-within:ring-focus-ring transition-all">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-text-muted" data-icon="lock">lock</span>
<div class="relative w-full input-floating-label flex flex-col-reverse">
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-text-primary placeholder-transparent peer mt-1 pr-8" id="password" placeholder=" " required="" type="password">
<label class="absolute left-0 text-text-secondary transition-all duration-200 transform origin-left peer-focus:-translate-y-5 peer-focus:scale-85 peer-focus:text-primary cursor-text" for="password">Mật khẩu</label>
</div>
<button class="text-text-muted hover:text-primary transition-colors focus:outline-none absolute right-4" type="button">
<span class="material-symbols-outlined" data-icon="visibility_off">visibility_off</span>
</button>
</div>
<p class="text-[12px] text-text-muted mt-2 ml-9">Mật khẩu cần ít nhất 8 ký tự</p>
</div>
<!-- Referral Code (Optional) -->
<div class="relative bg-surface-container-lowest rounded-xl border border-border-soft px-4 py-3 shadow-sm focus-within:border-primary focus-within:ring-1 focus-within:ring-focus-ring transition-all">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-text-muted" data-icon="redeem">redeem</span>
<div class="relative w-full input-floating-label flex flex-col-reverse">
<input class="w-full bg-transparent border-none p-0 focus:ring-0 text-text-primary placeholder-transparent peer mt-1" id="referral" placeholder=" " type="text">
<label class="absolute left-0 text-text-secondary transition-all duration-200 transform origin-left peer-focus:-translate-y-5 peer-focus:scale-85 peer-focus:text-primary cursor-text" for="referral">Mã giới thiệu (không bắt buộc)</label>
</div>
</div>
</div>
<div class="mt-auto pt-6 flex flex-col gap-4">
<!-- Consent Text -->
<p class="font-body-sm text-body-sm text-text-secondary text-center px-4">
                    Bằng việc đăng ký, bạn đồng ý với <a class="text-primary font-medium hover:underline" href="#">Điều khoản sử dụng</a> và <a class="text-primary font-medium hover:underline" href="#">Chính sách bảo mật</a> của chúng tôi.
                </p>
<!-- Primary Action Button -->
<button class="w-full gradient-btn text-on-primary font-cta text-cta py-4 rounded-xl shadow-float flex items-center justify-center transition-all hover:opacity-90 active:scale-[0.98]" id="register-btn" type="submit">
<span id="btn-text">Đăng ký ngay</span>
<div class="hidden flex items-center gap-2" id="btn-loading">
<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>
<span>Đang xử lý...</span>
</div>
</button>
<!-- Secondary Action -->
<a class="w-full bg-transparent border-2 border-transparent text-primary font-cta text-cta py-3 rounded-xl flex items-center justify-center hover:bg-mint-surface transition-colors" href="#">
                    Đã có tài khoản? Đăng nhập
                </a>
</div>
</form>
</main>
<!-- Bottom Nav Bar - Suppressed for auth flow -->
</body></html>
