        .hero-gradient { background: linear-gradient(135deg, #0F8E62 0%, #32C789 100%); }
    </style>

    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen flex flex-col font-sans antialiased">
<!-- TopAppBar Semantic Shell - Linear Flow: Hidden/Simplified for Login -->
<header class="w-full flex justify-center items-center py-xl bg-surface/80 sticky top-0 backdrop-blur-md z-50">
<h1 class="font-display-hero text-display-hero text-primary text-center">NaBi Wellness</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-page-padding">
<div class="w-full max-w-md bg-surface-container-lowest rounded-[20px] p-card-padding shadow-[0_8px_20px_rgba(20,163,111,0.08)] border border-border-soft">
<div class="text-center mb-section-gap">
<h2 class="font-screen-title text-screen-title text-text-primary mb-sm">Chào mừng trở lại</h2>
<p class="font-body-base text-body-base text-text-secondary">Đăng nhập để tiếp tục hành trình sức khỏe của bạn.</p>
</div>
<form class="space-y-md">
<!-- Email Input -->
<div class="relative">
<label class="block font-body-sm text-body-sm text-text-secondary mb-xs" for="email">Email</label>
<div class="relative flex items-center">
<span aria-hidden="true" class="material-symbols-outlined absolute left-md text-text-muted" data-icon="mail">mail</span>
<input class="w-full pl-xl pr-md py-sm bg-mint-surface border border-transparent rounded-lg font-body-base text-body-base text-text-primary focus:border-primary focus:ring-2 focus:ring-focus-ring/30 focus:outline-none transition-all placeholder-text-muted/60" id="email" name="email" placeholder="Nhập email của bạn" required="" type="email">
</div>
</div>
<!-- Password Input -->
<div class="relative">
<div class="flex justify-between items-center mb-xs">
<label class="block font-body-sm text-body-sm text-text-secondary" for="password">Mật khẩu</label>
<a class="font-body-sm text-body-sm text-primary hover:text-tertiary-container transition-colors" href="#">Quên mật khẩu?</a>
</div>
<div class="relative flex items-center">
<span aria-hidden="true" class="material-symbols-outlined absolute left-md text-text-muted" data-icon="lock">lock</span>
<input class="w-full pl-xl pr-xl py-sm bg-mint-surface border border-transparent rounded-lg font-body-base text-body-base text-text-primary focus:border-primary focus:ring-2 focus:ring-focus-ring/30 focus:outline-none transition-all placeholder-text-muted/60" id="password" name="password" placeholder="Nhập mật khẩu" required="" type="password">
<button aria-label="Hiện mật khẩu" class="absolute right-md text-text-muted hover:text-text-primary focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Primary CTA -->
<div class="pt-sm">
<button class="w-full hero-gradient text-on-primary font-cta text-cta py-md rounded-full shadow-[0_4px_12px_rgba(20,163,111,0.2)] hover:shadow-[0_6px_16px_rgba(20,163,111,0.3)] active:scale-[0.98] transition-all flex justify-center items-center gap-xs" type="submit">
                        Đăng nhập
                        <span aria-hidden="true" class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<!-- Secondary Options -->
<div class="mt-section-gap text-center">
<p class="font-body-sm text-body-sm text-text-secondary">
                    Chưa có tài khoản? 
                    <a class="font-cta text-cta text-primary hover:text-tertiary-container transition-colors ml-xs" href="#">Tạo tài khoản</a>
</p>
</div>
</div>
</main>
<!-- BottomNavBar Suppressed - Linear Flow (Login) -->
<script>
        // Simple password toggle logic
        document.addEventListener('DOMContentLoaded', () => {
            const passwordInput = document.getElementById('password');
            const toggleButton = passwordInput.nextElementSibling;
            const toggleIcon = toggleButton.querySelector('.material-symbols-outlined');

            toggleButton.addEventListener('click', () => {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    toggleIcon.textContent = 'visibility_off';
                    toggleIcon.setAttribute('data-icon', 'visibility_off');
                } else {
                    passwordInput.type = 'password';
                    toggleIcon.textContent = 'visibility';
                    toggleIcon.setAttribute('data-icon', 'visibility');
                }
            });
        });
    </script>
</body></html>
